# Checks that the site builds. Deployment itself is done by Netlify.
name: Build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  jekyll:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8 # Cyrillic file names need a UTF-8 locale
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec jekyll build --strict_front_matter
