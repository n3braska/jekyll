    <title>J-1 CMS sandbox</title>
    <!-- The real admin config, but with Decap's in-memory test backend: nothing is saved anywhere. -->

    </script>
</head>
<body>
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
<script src="/admin/timetable/parser.js"></script>
<script src="/admin/timetable/widget.js"></script>
<script src="/admin/timetable/preview.js"></script>
<script>
    CMS.init({ config: { backend: { name: 'test-repo' } } });
</script>
</body>
