---
backend:
  branch: master
  name: git-gateway

publish_mode: editorial_workflow

media_folder: assets/images/uploads

collections:
  - label: "Розклад / Gottesdienstordnung"
    label_singular: "Місяць / Monat"
    name: timetable
    description: "Один запис = один місяць. Додайте Word-файл і натисніть «Заповнити». / Ein Eintrag = ein Monat. Word-Datei anhängen und „Ausfüllen“ klicken."
    folder: _data/timetable
    extension: yml
    format: yaml
    create: true
    identifier_field: month.month_date
    summary: "{{month.month_date}}"
    fields:
      - label: "Опублікувати / Veröffentlichen"
        name: published
        widget: boolean
        default: true
        hint: "На сайті показуються щонайбільше 2 місяці: поточний і наступний. / Auf der Website werden höchstens 2 Monate angezeigt: der aktuelle und der nächste."
      - label: "Місяць / Monat"
        name: month
        widget: timetable
        fields:
          - label: "Місяць (РРРР-ММ) / Monat (JJJJ-MM)"
            name: month_date
            widget: string
            pattern: ['^\d{4}-(0[1-9]|1[0-2])$', "РРРР-ММ / JJJJ-MM, напр. 2026-11"]
          - label: "Word-файл / Word-Datei"
            name: source_docx
            widget: file
            required: false
            media_folder: /assets/timetables
            public_folder: /assets/timetables
          - label: "Українською"
            name: ua
            widget: object
            collapsed: true
            fields: &language_fields
              - label: "Оголошення St. Barbara / Ankündigung St. Barbara"
                name: announcement
                widget: text
                required: false
              - label: "Оголошення Jesuitenkirche / Ankündigung Jesuitenkirche"
                name: announcement_jesuit
                widget: text
                required: false
              - label: "Дні / Tage"
                name: day
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.d}}"
                fields:
                  - label: "Число / Tag"
                    name: d
                    widget: number
                    value_type: int
                    min: 1
                    max: 31
                  - label: "Богослужіння / Gottesdienste"
                    name: event
                    widget: list
                    required: false
                    summary: "{{fields.time}} {{fields.title}}"
                    fields:
                      - label: "Час / Zeit"
                        name: time
                        widget: string
                        required: false
                        pattern: ['^(\d{2}:\d{2})?$', "ГГ:ХХ / HH:MM"]
                      - label: "Назва / Titel"
                        name: title
                        widget: string
                      - label: "Церква отців Єзуїтів / Jesuitenkirche"
                        name: isJesuitenKirche
                        widget: boolean
                        default: false
                        hint: "Увімкнено: розклад Jesuitenkirche, інакше St. Barbara. / An: Jesuitenkirche, sonst St. Barbara."
                      - label: "Примітки / Anmerkungen"
                        name: occasion
                        widget: list
                        required: false
                        field:
                          label: "Примітка / Anmerkung"
                          name: note
                          widget: string
          - label: "Deutsch"
            name: de
            widget: object
            collapsed: true
            fields: *language_fields
  - label: Новини UA/DE
    name: news_ua_de
    files:
      - label: Barbareum UA
        name: barbareum_ua
        file: _data/ua/barbareum.yml
        fields:
          - label: Новини
            name: news
            widget: list
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Автор, name: autor, required: false, widget: string }
              - { label: Дата публікації, name: date, widget: date, format: 'DD.MM.YYYY' }
              - { label: Зображення, name: picture, required: false, widget: image }
              - { label: Перший абзац, name: excerpt, required: false, widget: markdown }
              - { label: Текст новини, name: text, widget: markdown }
      - label: Barbareum DE
        name: barbareum_de
        file: _data/de/barbareum.yml
        fields:
          - label: Nachricht
            name: news
            widget: list
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Autor, name: autor, required: false, widget: string }
              - { label: Publikationsdatum, name: date, widget: date, format: 'DD.MM.YYYY' }
              - { label: Bild, name: picture, required: false, widget: image }
              - { label: Erster Absatz, name: excerpt, required: false, widget: markdown }
              - { label: Weiterer Text, name: text, widget: markdown }
      - label: Стрічка новин Церква
        name: news_ua
        file: _data/ua/news.yml
        fields:
          - label: Новини
            name: news
            widget: list
            fields:
              - {label: Заголовок, name: title, widget: string}
              - {label: Автор, name: autor, required: false, widget: string}
              - {label: Дата публікації, name: date, widget: date, format: 'DD.MM.YYYY'}
              - {label: Зображення, name: picture, required: false, widget: image}
              - {label: Перший абзац, name: excerpt, required: false, widget: markdown}
              - {label: Текст новини, name: text, widget: markdown}
      - label: Nachrichten Kirche
        name: news_de
        file: _data/de/news.yml
        fields:
          - label: Nachricht
            name: news
            widget: list
            fields:
              - {label: Titel, name: title, widget: string}
              - {label: Autor, name: autor, required: false, widget: string}
              - {label: Publikationsdatum, name: date, widget: date, format: 'DD.MM.YYYY'}
              - {label: Bild, name: picture, required: false, widget: image}
              - {label: Erster Absatz, name: excerpt, required: false, widget: markdown}
              - {label: Weiterer Text, name: text, widget: markdown}
  - label: Всі Сторінки
    name: pages
    files:
      - label: Головне Меню
        name: navbar_ua
        file: _data/ua/navigation.yml
        fields:
          - label: Елемент меню
            name: navbar
            widget: list
            fields:
              - {label: Назва, name: name, widget: string}
              - {label: Лінк, name: link, widget: string}
      - label: Hauptmenu
        name: navbar_de
        file: _data/de/navigation.yml
        fields:
          - label: Element
            name: navbar
            widget: list
            fields:
              - { label: Titel, name: name, widget: string }
              - { label: Verlinkung, name: link, widget: string }
      - label: Галерея
        name: gallerie
        file: _data/events/gallerie.yaml
        fields:
          - label: Подія
            name: event
            widget: list
            fields:
              - label: Заголовок українською
                name: ua
                widget: string
                required: true
              - label: Заголовок німецькою
                name: de
                widget: string
                required: true
              - label: Титульне фото
                name: title_pic
                widget: image
              - label: Колекція
                name: collection
                required: true
                widget: list
                fields:
                  - label: Фото
                    name: pic
                    widget: image
      - label: Пожертви
        name: pozhertvy_ua
        file: _data/ua/pozhertvy.yml
        fields:
          - label: Пожертва
            name: pozhertva
            widget: list
            fields:
              - label: Призначення
                name: subject
                widget: string
                required: true
              - label: Число
                name: date
                widget: date
                format: 'DD-MM-YYYY'
                required: true
              - label: Необхідно
                name: needed
                widget: number
                required: false
              - label: Текст
                name: text
                widget: string
                required: true
              - label: Зібрано
                name: collected
                widget: number
                required: false
              - label: Картинка
                name: image
                widget: image
                required: true
              - label: Внески
                name: donations
                widget: list
                fields:
                  - label: Від кого
                    name: from
                    widget: string
                    required: false
                  - label: На кого
                    name: for
                    widged: string
                    required: false
                  - label: Сума
                    name: amount
                    widget: number
                    required: true
                  - label: Число
                    name: date
                    widget: date
                    format: 'DD-MM-YYYY'
                    required: true
      - label: Spenden
        name: pozhertvy_de
        file: _data/de/pozhertvy.yml
        fields:
          - label: Spende
            name: pozhertva
            widget: list
            fields:
              - label: Zweck
                name: subject
                widget: string
                required: true
              - label: Datum
                name: date
                widget: date
                format: 'DD-MM-YYYY'
                required: true
              - label: Erforderlich
                name: needed
                widget: number
                required: true
              - label: Gesammelt
                name: collected
                widget: number
                required: false
              - label: Текст
                name: text
                widget: string
                required: true
              - label: Bild
                name: image
                widget: image
                required: false
              - label: Beiträge
                name: donations
                widget: list
                fields:
                  - label: Von
                    name: from
                    widget: string
                    required: false
                  - label: Auf wen
                    name: for
                    widged: string
                    required: false
                  - label: Summe
                    name: amount
                    widget: number
                    required: true
                  - label: Datum
                    name: date
                    widget: date
                    format: 'DD-MM-YYYY'
                    required: true
