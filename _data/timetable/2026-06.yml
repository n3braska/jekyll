    announcement: "У церкві св. Варвари: Postgasse 8A. Сповідь до або після богослужінь по домовленості зі священиком. З понеділка 03 червня по четвер 6 червня священики парафії перебувають на загальноєвропейських зборах священиків. З цієї причини наступна літургія відслужиться у п'ятницю, 07 червня."
