  de:
    announcement: "In der Kirche St. Barbara: Postgasse 8A. Beichtgelegenheit vor und nach den Gottesdiensten nach Vereinbarung mit dem Priester. Von Montag, dem 03. Juni, bis Donnerstag, dem 6. Juni, werden die Priester der Pfarre an einem europaweiten Priestertreffen teilnehmen. Aus diesem Grund wird die nächste Liturgie erst am Freitag, den 07. Juni gefeiert."
